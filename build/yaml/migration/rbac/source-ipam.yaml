apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supervisor-network-migration-source-ipam
  namespace: vmware-system-netop
rules:
- apiGroups: [netoperator.vmware.com]
  resources: [networks]
  verbs: [get]
- apiGroups: [netoperator.vmware.com]
  resources: [ipaddressallocations]
  verbs: [get, create]
