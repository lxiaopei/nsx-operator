---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: supervisor-network-migration-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
- apiGroups:
  - migration.network.vmware.com
  resources:
  - controlplanenetworktransitions
  - namespacenetworktransitions
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - migration.network.vmware.com
  resources:
  - controlplanenetworktransitions/finalizers
  - namespacenetworktransitions/finalizers
  verbs:
  - update
- apiGroups:
  - migration.network.vmware.com
  resources:
  - controlplanenetworktransitions/status
  - namespacenetworktransitions/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supervisor-network-migration-operator
  namespace: vmware-system-nsx
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
